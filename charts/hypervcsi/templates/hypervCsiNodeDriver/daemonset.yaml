{{- if .Values.global.hypervcsinodedriver.enabled }}
apiVersion: apps/v1
kind: DaemonSet
metadata:
  name: {{ .Release.Name }}-hypervcsinodedriver
  labels:
    app: {{ .Release.Name }}-hypervcsinodedriver
    chart: "{{ .Chart.Name }}-{{ .Chart.Version }}"
    release: "{{ .Release.Name }}"
    heritage: "{{ .Release.Service }}"
spec:
  selector:
    # Only stable labels here: the selector is immutable, so the chart version must not be part of it.
    matchLabels:
      app: {{ .Release.Name }}-hypervcsinodedriver
      release: "{{ .Release.Name }}"
  updateStrategy:
    type: RollingUpdate
    rollingUpdate:
      maxUnavailable: 1
  template:
    metadata:
      labels:
        app: {{ .Release.Name }}-hypervcsinodedriver
        chart: "{{ .Chart.Name }}-{{ .Chart.Version }}"
        release: "{{ .Release.Name }}"
        heritage: "{{ .Release.Service }}"
    spec:
      tolerations:
        # these tolerations are to have the daemonset runnable on control plane nodes
        # remove them if your control plane nodes should not run pods
        - key: node-role.kubernetes.io/control-plane
          operator: Exists
          effect: NoSchedule
        - key: node-role.kubernetes.io/master
          operator: Exists
          effect: NoSchedule

{{- with .Values.global.imagePullSecrets }}
      imagePullSecrets:
{{ toYaml . | indent 8 }}
{{- end }}
      containers:
        - name: hypervcsinodedriver
          image: "{{ .Values.global.hypervcsinodedriver.image.repository }}:{{ .Values.global.imageTag }}"
          imagePullPolicy: IfNotPresent
          securityContext:
            privileged: true  # TODO: Remove privileged mode later and test
            capabilities:
              add:
                - SYS_ADMIN
          lifecycle:
            preStop:
              exec:
                command: ["/bin/sh", "-c", "rm -f /csi/csi.sock"]
          env:
{{- if .Values.global.hypervcsinodedriver.environment }}
{{ toYaml .Values.global.hypervcsinodedriver.environment | indent 12 }}
{{- end }}
          volumeMounts:
            - mountPath: /csi
              name: plugin-dir
            - mountPath: /var/lib/kubelet
              mountPropagation: Bidirectional
              name: mountpoint-dir
            - mountPath: /dev
              name: dev-dir
            - mountPath: /var/lib/hyperv
              name: hyperv-dir
            - mountPath: /sockets
              name: socket-dir
            - mountPath: /sys/bus/scsi/devices
              name: sys-devices-dir
            - mountPath: /sys/class/
              name: sys-class
{{- include "hypervcsi.licenseVolumeMount" . | nindent 12 }}
        - name: csi-node-driver-registrar
          image: registry.k8s.io/sig-storage/csi-node-driver-registrar:v2.17.0
          args:
            - "--csi-address=/csi/csi.sock"
            - "--kubelet-registration-path=/var/lib/kubelet/plugins/eu.nova.csi.hyperv/csi.sock"
            - "--health-port=9809"
          ports:
            - containerPort: 9809
              name: healthz
          livenessProbe:
            httpGet:
              path: /healthz
              port: healthz
            initialDelaySeconds: 30
            timeoutSeconds: 15
            periodSeconds: 60
          lifecycle:
            preStop:
              exec:
                command: ["/bin/sh", "-c", "rm -f /registration/eu.nova.csi.hyperv-reg.sock"]
          resources:
            requests:
              cpu: 10m
              memory: 24Mi
            limits:
              memory: 64Mi
          volumeMounts:
            - name: socket-dir
              mountPath: /csi
            - name: registration-dir
              mountPath: /registration
      volumes:
{{- include "hypervcsi.licenseVolume" . | nindent 8 }}
        - hostPath:
            path: /var/lib/kubelet/plugins_registry/
            type: Directory
          name: registration-dir
        - hostPath:
            path: /var/lib/kubelet/plugins/eu.nova.csi.hyperv/
            type: DirectoryOrCreate
          name: plugin-dir
        - hostPath:
            path: /var/lib/kubelet
            type: Directory
          name: mountpoint-dir
        - hostPath:
            path: /dev
            type: Directory
          name: dev-dir
        - hostPath:
            path: /var/lib/hyperv
            type: Directory
          name: hyperv-dir
        - hostPath:
            path: /var/lib/kubelet/plugins/eu.nova.csi.hyperv
            type: DirectoryOrCreate
          name: socket-dir
        - hostPath:
            path: /sys/class/
            type: Directory
          name: sys-class
        - hostPath:
            path: /sys/bus/scsi/devices
            type: Directory
          name: sys-devices-dir

{{- end }}
